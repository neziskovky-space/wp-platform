# BEGIN NZ Cache
# Paste at the TOP of /srv/www/wordpress/.htaccess (before WP Rocket and WordPress blocks).
# Serves wp-content/cache/nz/{host}/{path}/index.html written by mu-plugins/nz-cache.php.
# Cookie list must match NZ_CACHE_BYPASS_COOKIES in nz-cache.php.
<IfModule mod_rewrite.c>
RewriteEngine On
RewriteCond %{REQUEST_METHOD} =GET
RewriteCond %{HTTPS} =on
RewriteCond %{QUERY_STRING} =""
RewriteCond %{REQUEST_URI} /$
RewriteCond %{HTTP:Cookie} !(wordpress_logged_in_|wp-postpass_|comment_author_|woocommerce_items_in_cart|wp_woocommerce_session_) [NC]
RewriteCond %{DOCUMENT_ROOT}/wp-content/cache/nz/%{HTTP_HOST}%{REQUEST_URI}index.html -f
RewriteRule ^ /wp-content/cache/nz/%{HTTP_HOST}%{REQUEST_URI}index.html [L,E=NZ_CACHE:1]
</IfModule>
<IfModule mod_headers.c>
Header set X-NZ-Cache "HIT" env=REDIRECT_NZ_CACHE
Header set Cache-Control "no-cache, must-revalidate" env=REDIRECT_NZ_CACHE
</IfModule>
# END NZ Cache
